<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

	<style>
		body {font-family: "Instrument Serif", serif;}
		div {color: rgb(0, 174, 255);}
		.quote { font-size: 4rem; }
		.source { font-style: italic;}
		.important { background: rgb(240, 204, 170);}

		.citation { 
			margin: 4rem;
			padding: 2rem;
			border: 4px solid rgb(255, 7, 148);
			border-radius: 7rem;
			border-top: 2px;
			border-bottom: 2px;
			aspect-ratio: 1,4/1;
		}

	#machin {background: rgb(255, 255, 0); }
	</style>

</head>
<body>

	<div class="citation">
		<div class="quote">"You don’t think your way to creative work. You work your way to creative thinking."</div>
		<div class="source important">— GEORGE NELSON</div>
	</div>

	<div class="citation" id="machin">
		<div class="quote">Design has to work, art does not.</div>
		<div class="source">— DONALD JUDD</div>
	</div>

</body>
</html>
